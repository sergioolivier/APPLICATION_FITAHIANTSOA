function CartScreen({ cart, setCart, onCheckout, goCatalogue }) {
  const update = (id, delta) =>
    setCart((c) =>
      c
        .map((it) => (it.id === id ? { ...it, qty: Math.max(1, it.qty + delta) } : it))
        .filter((it) => it.qty > 0)
    );
  const remove = (id) => setCart((c) => c.filter((it) => it.id !== id));
  const subtotal = cart.reduce((s, it) => s + it.price * it.qty, 0);
  const delivery = cart.length ? 60000 : 0;
  const total = subtotal + delivery;

  if (!cart.length) {
    return (
      <div className="screen">
        <TopBar title="Panier" />
        <div className="empty-state">
          <ShoppingCart size={36} />
          <p>Votre panier est vide</p>
          <button className="btn-primary" onClick={goCatalogue}>Voir le catalogue</button>
        </div>
      </div>
    );
  }
  return (
    <div className="screen">
      <TopBar title={"Panier (" + cart.length + ")"} right={<span className="link-btn" onClick={() => setCart([])}>Vider</span>} />
      <div className="screen-body">
        {cart.map((it) => (
          <div key={it.id} className="cart-item">
            <img src={it.img} alt={it.name} />
            <div className="cart-item-info">
              <p className="product-name">{it.name}</p>
              <p className="product-price">{fmt(it.price)}</p>
            </div>
            <div className="qty-ctrl">
              <button onClick={() => update(it.id, -1)}><Minus size={13} /></button>
              <span>{it.qty}</span>
              <button onClick={() => update(it.id, 1)}><Plus size={13} /></button>
            </div>
          </div>
        ))}
        <div className="summary-box">
          <div className="summary-row"><span>Sous-total</span><span>{fmt(subtotal)}</span></div>
          <div className="summary-row"><span>Livraison</span><span>{fmt(delivery)}</span></div>
          <div className="summary-row total"><span>Total</span><span>{fmt(total)}</span></div>
        </div>
      </div>
      <div className="sticky-actions">
        <button className="btn-primary full" onClick={onCheckout}>Passer la commande</button>
      </div>
    </div>
  );
}

function CheckoutScreen({ cart, onConfirm, onBack }) {
  const [step, setStep] = useState(1);
  const [currency, setCurrency] = useState("MGA");
  const [payment, setPayment] = useState("mobile");
  const subtotal = cart.reduce((s, it) => s + it.price * it.qty, 0) + 60000;
  const steps = ["Adresse", "Paiement", "Confirmation"];

  return (
    <div className="screen">
      <TopBar title="Commande" onBack={onBack} />
      <div className="screen-body">
        <div className="step-indicator">
          {steps.map((s, i) => (
            <React.Fragment key={s}>
              <div className={"step" + (i + 1 <= step ? " active" : "")}>
                <span className="step-dot">{i + 1 < step ? <Check size={11} /> : i + 1}</span>
                {s}
              </div>
              {i < steps.length - 1 && <div className="step-line" />}
            </React.Fragment>
          ))}
        </div>

        {step === 1 && (
          <div className="form-card">
            <h3 className="mini-title">Adresse de livraison</h3>
            <label>Nom complet<input defaultValue="Rakoto Andriana" /></label>
            <label>Adresse<input defaultValue="Lot II M 45, Antananarivo" /></label>
            <label>Téléphone<input defaultValue="+261 34 00 000 00" /></label>
            <button className="btn-primary full" onClick={() => setStep(2)}>Continuer</button>
          </div>
        )}

        {step === 2 && (
          <div className="form-card">
            <h3 className="mini-title">Moyen de paiement</h3>
            {[
              ["mobile", "Mobile Money"],
              ["carte", "Carte bancaire"],
              ["virement", "Virement bancaire"],
            ].map(([id, label]) => (
              <button
                key={id}
                className={"pay-option" + (payment === id ? " active" : "")}
                onClick={() => setPayment(id)}
              >
                <span className="radio">{payment === id && <span className="radio-dot" />}</span>
                {label}
              </button>
            ))}
            <h3 className="mini-title">Devise</h3>
            <div className="chip-row">
              {["MGA", "EUR", "USD"].map((c) => (
                <span
                  key={c}
                  className={"chip selectable" + (currency === c ? " on" : "")}
                  onClick={() => setCurrency(c)}
                >
                  {c}
                </span>
              ))}
            </div>
            <button className="btn-primary full" onClick={() => setStep(3)}>Continuer</button>
          </div>
        )}

        {step === 3 && (
          <div className="form-card">
            <h3 className="mini-title">Récapitulatif</h3>
            <div className="summary-box">
              {cart.map((it) => (
                <div key={it.id} className="summary-row">
                  <span>{it.name} × {it.qty}</span>
                  <span>{fmt(it.price * it.qty)}</span>
                </div>
              ))}
              <div className="summary-row total"><span>Total ({currency})</span><span>{fmt(subtotal)}</span></div>
            </div>
            <button className="btn-primary full" onClick={onConfirm}>Confirmer la commande</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------- App racine ---------------- */
function App() {
  const [started, setStarted] = useState(false);
  const [role, setRole] = useState("client");
  const [screen, setScreen] = useState("home");
  const [category, setCategory] = useState(null);
  const [selected, setSelected] = useState(null);
  const [cart, setCart] = useState([]);
  const [favs, setFavs] = useState([]);
  const [orders, setOrders] = useState([]);
  const [activeOrder, setActiveOrder] = useState(null);
  const [showSwitcher, setShowSwitcher] = useState(false);
  const [prevScreen, setPrevScreen] = useState("home");

  const toggleFav = (id) =>
    setFavs((f) => (f.includes(id) ? f.filter((x) => x !== id) : [...f, id]));

  const openProduct = (p) => {
    setPrevScreen(screen);
    setSelected(p);
    setScreen("product");
  };

  const addToCart = (p) => {
    setCart((c) => {
      const found = c.find((it) => it.id === p.id);
      if (found) return c.map((it) => (it.id === p.id ? { ...it, qty: it.qty + 1 } : it));
      return [...c, { ...p, qty: 1 }];
    });
    setScreen("panier");
  };

  const buyNow = (p) => {
    addToCart(p);
  };

  const confirmOrder = () => {
    const id = "FT" + Math.floor(20250000 + Math.random() * 9999);
    const total = cart.reduce((s, it) => s + it.price * it.qty, 0) + 60000;
    const order = { id, items: cart, total, stage: 3 };
    setOrders((o) => [order, ...o]);
    setActiveOrder(order);
    setCart([]);
    setScreen("tracking");
  };

  const cartCount = cart.reduce((s, it) => s + it.qty, 0);

  const goProClient = () => {
    setStarted(true);
    setRole("client");
    setScreen("home");
  };

  if (!started) {
    return (
      <div className="fita-app">
        <GlobalStyles />
        <div className="phone-wrap">
          <SplashScreen onStart={goProClient} onLogin={goProClient} />
        </div>
      </div>
    );
  }

  if (showSwitcher) {
    return (
      <div className="fita-app">
        <GlobalStyles />
        <div className="phone-wrap">
          <RoleSwitcherScreen
            onBack={() => setShowSwitcher(false)}
            onSelect={(r) => {
              setRole(r);
              setShowSwitcher(false);
              if (r === "client") setScreen("home");
            }}
          />
        </div>
      </div>
    );
  }

  let content = null;

  if (role === "fournisseur") content = <FournisseurScreen onSwitchRole={() => setShowSwitcher(true)} />;
  else if (role === "employe") content = <EmployeScreen onSwitchRole={() => setShowSwitcher(true)} />;
  else if (role === "admin") content = <AdminScreen onSwitchRole={() => setShowSwitcher(true)} />;
  else if (role === "logistique") content = <LogistiqueScreen onSwitchRole={() => setShowSwitcher(true)} />;
  else {
    if (screen === "home")
      content = (
        <HomeScreen
          onOpenProduct={openProduct}
          cartCount={cartCount}
          favs={favs}
          toggleFav={toggleFav}
          setCategory={setCategory}
          goCatalogue={() => setScreen("catalogue")}
        />
      );
    else if (screen === "catalogue")
      content = (
        <CatalogueScreen
          onOpenProduct={openProduct}
          favs={favs}
          toggleFav={toggleFav}
          category={category}
          setCategory={setCategory}
        />
      );
    else if (screen === "product")
      content = (
        <ProductScreen
          product={selected}
          onBack={() => setScreen(prevScreen)}
          onAddToCart={addToCart}
          onBuyNow={buyNow}
          fav={favs.includes(selected.id)}
          onFav={toggleFav}
        />
      );
    else if (screen === "panier")
      content = (
        <CartScreen
          cart={cart}
          setCart={setCart}
          onCheckout={() => setScreen("checkout")}
          goCatalogue={() => setScreen("catalogue")}
        />
      );
    else if (screen === "checkout")
      content = <CheckoutScreen cart={cart} onConfirm={confirmOrder} onBack={() => setScreen("panier")} />;
    else if (screen === "tracking")
      content = <TrackingScreen order={activeOrder || { id: "20250827", stage: 3 }} onBack={() => setScreen("commandes")} />;
    else if (screen === "favoris")
      content = <FavorisScreen favs={favs} toggleFav={toggleFav} onOpen={openProduct} />;
    else if (screen === "commandes")
      content = (
        <CommandesScreen
          orders={orders}
          onTrack={(o) => {
            setActiveOrder(o);
            setScreen("tracking");
          }}
        />
      );
    else if (screen === "compte")
      content = <CompteScreen onSwitchRole={() => setShowSwitcher(true)} />;
  }

  const showBottomNav = role === "client" && ["home", "catalogue", "favoris", "commandes", "compte"].includes(screen);

  return (
    <div className="fita-app">
      <GlobalStyles />
      <div className="phone-wrap">
        <div className="phone-body">
          {content}
          {showBottomNav && <BottomNav screen={screen} setScreen={setScreen} cartCount={cartCount} />}
        </div>
      </div>
    </div>
  );
}

      .order-number { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
      .timeline { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
      .timeline-item { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); padding: 8px 0; }
      .timeline-item.done { color: var(--forest); font-weight: 600; }
      .timeline-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--line); color: #fff; display: flex; align-items: center; justify-content: center; }
      .timeline-item.done .timeline-dot { background: var(--forest); }
      .map-placeholder { background: #DDE6DA; border-radius: 14px; height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--forest); font-size: 12.5px; font-weight: 600; margin-bottom: 14px; }
      .delivery-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 12.5px; line-height: 1.8; margin-bottom: 14px; }

      /* Orders list */
      .order-card { width: 100%; display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 13px; margin-bottom: 10px; cursor: pointer; text-align: left; }
      .status-pill { font-size: 10.5px; background: #EEF3EC; color: var(--forest); padding: 4px 9px; border-radius: 20px; font-weight: 600; }
      .status-pill.small { font-size: 9.5px; padding: 2px 7px; }

      /* Compte */
      .profile-card { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
      .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--forest); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
      .avatar.small { width: 34px; height: 34px; font-size: 12px; }
      .account-row { display: flex; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid var(--line); font-size: 13px; }

      /* Bottom nav */
      .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--line); display: flex; padding: 8px 4px 10px; }
      .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 9.5px; color: var(--muted); background: none; border: none; cursor: pointer; font-family: inherit; }
      .nav-item.active { color: var(--forest); font-weight: 600; }
      .nav-icon-wrap { position: relative; }
      .nav-badge { position: absolute; top: -5px; right: -8px; background: var(--terracotta); color: #fff; font-size: 8.5px; border-radius: 50%; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; }
      .cart-wrap { position: relative; display: flex; }
      .cart-dot { position: absolute; top: -6px; right: -7px; background: var(--terracotta); color: #fff; font-size: 8.5px; border-radius: 50%; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; }

      /* Pro dashboards */
      .revenue-card { background: var(--forest); color: #fff; border-radius: 15px; padding: 16px; margin-bottom: 14px; }
      .revenue-card p:first-child { font-size: 12px; opacity: 0.8; margin: 0 0 6px; }
      .revenue-value { font-size: 21px; font-weight: 700; margin: 0; }
      .up { color: var(--ochre); font-size: 12px; font-weight: 600; margin-left: 6px; }
      .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
      .stat-row.two { grid-template-columns: repeat(2, 1fr); }
      .stat-card { background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 11px 9px; }
      .stat-icon { width: 26px; height: 26px; border-radius: 8px; background: #EEF3EC; color: var(--forest); display: flex; align-items: center; justify-content: center; margin-bottom: 7px; }
      .stat-label { font-size: 10px; color: var(--muted); margin: 0 0 4px; }
      .stat-value { font-size: 13.5px; font-weight: 700; margin: 0; }
      .stat-delta { font-size: 10px; color: var(--forest); margin: 3px 0 0; font-weight: 600; }

      .validation-card { display: flex; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 10px; margin-bottom: 10px; }
      .validation-card img { width: 54px; height: 54px; object-fit: cover; border-radius: 10px; }
      .validation-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
      .validation-actions.column { flex-direction: column; margin-top: 0; }
      .btn-accept, .btn-modify, .btn-reject { border: none; border-radius: 8px; font-size: 10.5px; font-weight: 600; padding: 6px 10px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
      .btn-accept { background: var(--forest); color: #fff; }
      .btn-modify { background: var(--ochre); color: #1F2E1F; }
      .btn-reject { background: #F3E4DC; color: var(--terracotta); }

      .fake-chart { display: flex; align-items: flex-end; gap: 6px; height: 90px; background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 12px; margin-bottom: 18px; }
      .fake-chart span { flex: 1; background: linear-gradient(180deg, var(--green-mid), var(--forest)); border-radius: 4px 4px 0 0; }
      .repartition { display: flex; align-items: center; gap: 18px; background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 14px; }
      .donut { width: 76px; height: 76px; border-radius: 50%; flex-shrink: 0; background: conic-gradient(var(--forest) 0% 56%, var(--ochre) 56% 68%, var(--terracotta) 68% 76%, var(--line) 76% 100%); position: relative; }
      .donut::after { content: ''; position: absolute; inset: 14px; background: #fff; border-radius: 50%; }
      .repartition-legend p { font-size: 11.5px; display: flex; align-items: center; gap: 6px; margin: 5px 0; }
      .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .dot.forest { background: var(--forest); }
      .dot.ochre { background: var(--ochre); }
      .dot.terracotta { background: var(--terracotta); }
      .dot.muted-dot { background: var(--line); }

      .mission-card { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 13px; padding: 12px; margin-bottom: 10px; }

      .role-row { width: 100%; display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; cursor: pointer; text-align: left; }
      .role-icon { width: 38px; height: 38px; border-radius: 10px; background: #EEF3EC; color: var(--forest); display: flex; align-items: center; justify-content: center; }
      .role-text { flex: 1; }

      @media (max-width: 420px) {
        .fita-app { padding: 0; }
        .phone-body { border-radius: 0; border-width: 0; min-height: 100vh; }
        .screen, .screen-body { min-height: unset; }
      }
    `}</style>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
